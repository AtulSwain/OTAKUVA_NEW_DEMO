<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141416">
<title>Offline · OTAKUVA</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: #141416; color: #EDEDEF;
    font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  }
  main { max-width: 420px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  img { width: 64px; height: 64px; opacity: 0.9; }
  h1 { margin: 6px 0 0; font-size: 24px; font-weight: 800; letter-spacing: -0.03em; }
  p { margin: 0; font-size: 15px; line-height: 1.55; color: #A1A1AA; }
  button {
    margin-top: 8px; min-height: 42px; padding: 0 22px; border: 0; border-radius: 999px;
    background: #fff; color: #111113; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  button:active { transform: scale(0.96); }
</style>
</head>
<body>
<main>
  <img src="/brand/otakuva-mark.png" alt="" width="64" height="64">
  <h1>You&rsquo;re offline</h1>
  <p>OTAKUVA needs a connection to load this page. Your library and ratings are safe. Try again once you&rsquo;re back online.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
